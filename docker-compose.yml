services:
  db:
    image: postgres:18
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: alter_event_tracker
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d alter_event_tracker"]
      interval: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /alter-tracker-backend
        awslogs-stream: db

  migrate:
    image: ghcr.io/club-vanta/alter-tracker-backend:latest
    pull_policy: always
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/alter_event_tracker
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /alter-tracker-backend
        awslogs-stream: migrate

  seed:
    image: ghcr.io/club-vanta/alter-tracker-backend:latest
    pull_policy: always
    command: python scripts/seed_admin.py
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/alter_event_tracker
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /alter-tracker-backend
        awslogs-stream: seed

  app:
    image: ghcr.io/club-vanta/alter-tracker-backend:latest
    pull_policy: always
    restart: always
    ports:
      - "80:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/alter_event_tracker
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JSON_LOGS: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /alter-tracker-backend
        awslogs-stream: app

  backup:
    image: ghcr.io/club-vanta/alter-tracker-backend-backup:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/alter_event_tracker
      BACKUP_BUCKET: alter-tracker-backend-db-backups-784421200272
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /alter-tracker-backend
        awslogs-stream: backup

volumes:
  postgres_data:
