[project]
name = "alter-tracker-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "passlib[argon2]",
    "argon2-cffi",
    "python-jose[cryptography]",
    "httpx",
    "python-dotenv",
    "prometheus-fastapi-instrumentator >= 7.1.0",
    "structlog>=25.5.0",
    "boto3>=1.42.74",
]

[dependency-groups]
dev = [
    "basedpyright",
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.1.0",
    "ruff",
]


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert statements in tests
# B008 — Depends in argument defaults — this is a false positive for FastAPI. Ruff doesn't know that FastAPI specifically relies on this pattern.
"app/routers/*" = ["B008"]
"app/core/deps.py" = ["B008"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "Linux"

typeCheckingMode = "standard"

# Paths basedpyright should analyse
include = ["app"]
exclude = ["**/__pycache__"]

# pytest fixtures injected for side-effects only (not accessed in body) trigger this
reportUnusedParameter = "none"
