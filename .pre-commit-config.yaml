# Notes:
# `language: system` tells pre-commit to use the system environment.
# All Python tools are invoked via `uv run` so they work both inside the
# Nix/devenv shell and in any environment where `uv` is available (CI, plain terminal).

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false

      - id: generate-openapi
        name: generate openapi.json
        entry: bash -c 'PYTHONPATH=. uv run python scripts/generate_openapi.py && git add openapi.json'
        language: system
        pass_filenames: false
        always_run: true

        # pytest runs on every push instead of every commit
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
