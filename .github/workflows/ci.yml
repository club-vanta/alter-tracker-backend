name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alter_event_tracker
          # The server runs in the club's zone, like a developer machine, so a
          # test that only passes when Postgres is in UTC fails here.
          TZ: America/Argentina/Buenos_Aires
          PGTZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/alter_event_tracker
      JWT_SIGNING_KEY: ci-signing-key-not-used-in-production
      # Tests run in the club's zone (UTC-3), not the runner's UTC.
      TZ: America/Argentina/Buenos_Aires

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (basedpyright)
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest --cov=app --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  infra:
    name: Infra, shell scripts, backup image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck scripts/*.sh docker/backup/backup.sh tests/infra/*.sh \
            deploy/host/alter-deploy deploy/host/push-metrics.sh \
            .github/scripts/*.sh infra/oci/scripts/*.sh

      - uses: opentofu/setup-opentofu@v1

      - name: OpenTofu format
        run: tofu fmt -check -recursive infra

      - name: OpenTofu validate
        run: |
          for root in infra infra/oci; do
            tofu -chdir="$root" init -backend=false -input=false
            tofu -chdir="$root" validate
          done

      - name: Backup and restore end to end
        run: tests/infra/test_backup_restore.sh
